<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="mathkit: free online calculators.">
<title>Mathkit - Online Calculator</title>
<!-- mathkit's own icon (favicon2.ico), embedded so it only exists on the mathkit deployment -->
<style>
:root{
  --text:#222; --muted:#666; --border:#d8d8d0; --line:#e6e6df; --accent:#2b5aa8; --link:#1f4f9e;
  --surface-2:#fbfbf8; --mono:"Courier New",Courier,monospace;
  --serif:Georgia,"Times New Roman",Times,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--text);font:16px/1.5 var(--serif);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--link)}
button{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:14px} .mono{font-family:var(--mono)}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:0 18px}

header{border-bottom:1px solid var(--border);background:#fff}
.brand{display:inline-block;margin-top:16px;font-size:26px;font-weight:bold;color:var(--text);text-decoration:none;letter-spacing:-.01em}
.brand i{font-weight:normal;color:var(--accent)}
.nav{display:flex;flex-wrap:wrap;gap:4px 18px;padding:6px 0 12px;font-size:15px}
.nav a{text-decoration:none}
.nav a:hover{text-decoration:underline}
.nav a.active{color:var(--text);font-weight:bold}
main.wrap{flex:1;padding-top:24px;padding-bottom:48px}
footer{border-top:1px solid var(--border);padding:16px 0;color:var(--muted);font-size:14px}

.page-head{margin-bottom:16px}
.page-head h1{font-size:25px;font-weight:normal;margin:0}
.page-head p{margin:2px 0 0;color:var(--muted)}
.panel{border:1px solid var(--border);padding:18px 20px;background:#fff}
.panel.mt{margin-top:18px}
.sec{font-size:18px;font-weight:normal;margin:24px 0 10px}
.sec.first{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px}
.field label{display:block;font-size:14px;color:#444;margin-bottom:3px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:#fff;border:1px solid #b5b5ad;border-radius:2px;padding:6px 8px;min-height:36px}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #d6e1f5}
input[type=checkbox]{width:16px;height:16px;min-height:0;margin:0;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px;cursor:pointer}
.btn,.icon-btn{font:inherit;font-size:15px;background:#f4f4f0;border:1px solid #b5b5ad;border-radius:2px;padding:5px 12px;cursor:pointer;min-height:36px;color:var(--text)}
.btn:hover,.icon-btn:hover{background:#eaeae4}
.icon-btn{padding:0;width:36px;line-height:1}
.result{margin-top:18px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line)}
.result .k{font-size:14px;color:var(--muted)}
.big{font-size:28px;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.sub{margin-top:2px;font-size:14px}
.err{color:#b3261e!important}
.big.err{font-size:18px}
.stats{margin-top:12px;border-top:1px solid var(--line)}
.stats:empty{display:none}
.stat{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.stat .sk{color:#555}
.stat .sv{text-align:right;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:16px;font-size:15px}
.pill{background:none;border:none;padding:0;color:var(--link);cursor:pointer;font:inherit;font-size:15px}
.pill:hover{text-decoration:underline}
.pill.on{color:var(--text);font-weight:bold;text-decoration:none}
.tag{color:var(--muted);font-size:13px;font-weight:normal}

/* Scientific */
.sci{max-width:430px}
.display{border:1px solid #b5b5ad;background:#fff;padding:6px 10px 8px}
.disp-bar{display:flex;justify-content:space-between;font-size:13px}
.chip{background:none;border:none;padding:0;color:var(--link);cursor:pointer;font-size:13px}
.chip:hover{text-decoration:underline}
.topline{font-size:14px;color:var(--muted);text-align:right;min-height:21px;overflow-wrap:anywhere}
.expr{border:none!important;box-shadow:none!important;padding:0;font-size:30px;text-align:right;min-height:40px}
.preview{font-size:14px;color:var(--muted);text-align:right;min-height:21px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.key{border:1px solid #bdbdb5;background:#f7f7f3;border-radius:3px;padding:10px 0;font-size:17px;cursor:pointer}
.key:hover{background:#ecece6}
.key:active{background:#e2e2db}
.key.fn{font-size:15px;background:#fff}
.key.op{background:#efefe9}
.key.clr{color:#b3261e}
.key.eq{background:var(--accent);border-color:#234b8e;color:#fff}
.key.eq:hover{background:#244d91}
.hist{margin-top:16px}
.hist h3{font-size:15px;font-weight:normal;color:var(--muted);margin:0 0 4px}
.hist-list{max-height:220px;overflow:auto;border-top:1px solid var(--line)}
.hitem{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;padding:5px 2px;cursor:pointer;font-size:15px}
.hitem:hover{background:var(--surface-2)}
.hitem .he{color:var(--muted);overflow-wrap:anywhere}
.tip{margin:12px 0 0}

/* Fractions */
.frac-row{display:grid;grid-template-columns:1fr 130px 1fr;gap:12px;align-items:end}
.frac-out{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;font-size:26px}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.fr .n{border-bottom:2px solid currentColor;padding:0 5px 1px}
.fr .d{padding:1px 5px 0}
.work{font-size:15px;color:var(--muted);margin-top:10px;overflow-wrap:anywhere}

/* Units */
.conv{display:grid;grid-template-columns:1fr 1fr auto 1fr;gap:10px;align-items:end}
.table{border-top:1px solid var(--line)}
.trow{display:flex;justify-content:space-between;gap:12px;width:100%;padding:6px 2px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-size:15px;text-align:left}
.trow:hover{background:var(--surface-2)}
.trow.on{font-weight:bold}
.trow .mono{font-family:inherit;text-align:right;overflow-wrap:anywhere}

/* Quadratic */
.plot{width:100%;height:280px;display:block;border:1px solid var(--line);margin-top:18px;background:#fff}
.eq-show{font-size:17px;margin-top:2px}

/* Time zones */
.tz-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tz-actions select{flex:1;min-width:200px}
.tz-list{margin-top:16px;border-top:1px solid var(--line)}
.tz-row{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.tz-row.src{background:var(--surface-2)}
.tz-right{text-align:right}
.tz-time{font-size:20px}

/* GPA */
.gpa-row{display:grid;grid-template-columns:minmax(0,1.6fr) 80px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center;margin-bottom:8px}
.gpa-head{font-size:14px;color:#444;margin-bottom:3px}

/* Fuel / dates */
.money{display:grid;grid-template-columns:70px 1fr;gap:8px}
.add-row{display:grid;grid-template-columns:1.4fr 110px 1fr 1fr;gap:12px;align-items:end}

@media (max-width:600px){
  main.wrap{padding-top:18px;padding-bottom:40px}
  .wrap{padding:0 14px}
  .panel{padding:14px}
  .frac-row{grid-template-columns:1fr}
  .conv{grid-template-columns:1fr auto 1fr}
  .conv .field:first-child{grid-column:1/-1}
  .add-row{grid-template-columns:1fr 1fr}
  .gpa-head{display:none}
  .gpa-row{grid-template-columns:1fr 1fr 36px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .gpa-row .gname{grid-column:1/3;grid-row:1}
  .gpa-row .gdel{grid-column:3/4;grid-row:1}
  .gpa-row .gcr{grid-column:1/2}
  .gpa-row .gg{grid-column:2/4}
  .gpa-row .gt{grid-column:1/4}
  .tz-time{font-size:17px}
}
</style>

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
function fmt(n, maxFrac = 10) {
  if (typeof n !== 'number' || Number.isNaN(n)) return '—';
  if (!Number.isFinite(n)) return n > 0 ? '∞' : '−∞';
  if (n === 0) return '0';
  const a = Math.abs(n);
  if (a >= 1e15 || a < 1e-7) return n.toExponential(6).replace(/\.?0+e/, 'e').replace('e+', 'e');
  return Number(n.toPrecision(12)).toLocaleString('en-US', { maximumFractionDigits: maxFrac });
}
const plain = n => String(Number(n.toPrecision(12)));
const stat = (k, v) => `<div class="stat"><div class="sk">${k}</div><div class="sv">${v}</div></div>`;
const num = el => { const v = parseFloat(el.value); return Number.isFinite(v) ? v : NaN; };
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); const dt = new Date(y, m - 1, d); dt.setFullYear(y); return dt; };
const daysBetween = (a, b) => Math.round((b - a) / 864e5);
const longDate = d => d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
const shortDate = d => d.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
const plural = (n, w) => `${fmt(n)} ${w}${n === 1 ? '' : 's'}`;
const coarse = matchMedia('(pointer: coarse)').matches;

/* ---------- registry ---------- */
const CALCS = [

/* ---------- expression engine (no eval) ---------- */
function tokenize(s) {

  function term() {
    let v = unary();
    for (;;) {
      if (isOp('*') || isOp('/')) { const o = t[p++].v, r = unary(); if (o === '/' && r === 0) throw Error('Can’t divide by zero'); v = o === '*' ? v * r : v / r; }

    }

  }
  function unary() { if (isOp('-')) { p++; return -unary(); } if (isOp('+')) { p++; return unary(); } return power(); }
  function power() { const b = postfix(); if (isOp('^')) { p++; return Math.pow(b, unary()); } return b; }
  function postfix() { let v = primary(); for (;;) { if (isOp('!')) { p++; v = factorial(v); } else if (isOp('%')) { p++; v /= 100; } else break; } return v; }

}

/* ---------- 2. Fractions ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

    <div class="frac-row">

      <div class="field"><label for="fb">Second fraction</label><input id="fb" value="1 2/3" autocomplete="off"></div>

/* ---------- 6. Dates ---------- */

    </div>

    st.innerHTML = stat('Weeks', `${fmt(Math.floor(n / 7))} wk, ${plural(n % 7, 'day')}`) + stat('Years · months · days', `${y}y ${m}m ${d}d`) +
      stat('Business days', fmt(bd)) + stat('Weekend days', fmt(n - bd)) + stat('Hours', fmt(n * 24)) + stat('Minutes', fmt(n * 1440));

/* ---------- 7. Time zones ---------- */
const _tzf = {};

  if (!all.includes('UTC')) all = ['UTC', ...all];
  if (!all.includes(local)) all.push(local);
  let targets = ['America/New_York', 'America/Chicago', 'America/Los_Angeles', 'Europe/London', 'Europe/Paris', 'Asia/Kolkata', 'Asia/Tokyo', 'Australia/Sydney'].filter(z => all.includes(z));
  const opts = all.map(z => `<option value="${z}">${z.replace(/_/g, ' ')}</option>`).join('');
  root.innerHTML = `<div class="panel">
    <div class="grid2">
      <div class="field"><label for="tt">Date &amp; time</label><input id="tt" type="datetime-local"></div>

    </div>
    <div class="tz-actions"><button type="button" class="btn ghost" id="tnow">Set to now</button><select id="tadd" aria-label="Add a time zone"><option value="">+ Add a time zone…</option>${opts}</select></div>

  const setNow = () => { const p = tzParts(tf.value, Date.now()); tt.value = `${p.year}-${p.month}-${p.day}T${pad(+p.hour % 24)}:${p.minute}`; };
  const timeF = {}, dateF = {};

      </div>`;
    }).join('');
  }

  $('#tadd').addEventListener('change', e => { const z = e.target.value; if (z && !targets.includes(z)) targets.push(z); e.target.value = ''; draw(); });

/* ---------- 8. GPA ---------- */
const GRADES = [['A+', 4.0], ['A', 4.0], ['A−', 3.7], ['B+', 3.3], ['B', 3.0], ['B−', 2.7], ['C+', 2.3], ['C', 2.0], ['C−', 1.7], ['D+', 1.3], ['D', 1.0], ['D−', 0.7], ['F', 0]];
const GP = Object.fromEntries(GRADES);
function gpa(root) {
  const rows = [{ name: '', cr: 3, g: 'A', t: 0 }, { name: '', cr: 3, g: 'B+', t: 0 }, { name: '', cr: 4, g: 'A−', t: 0 }, { name: '', cr: 3, g: 'B', t: 0 }];
  root.innerHTML = `<div class="panel">
    <div class="gpa-row gpa-head"><span>Course</span><span>Credits</span><span>Grade</span><span>Level</span><span></span></div>
    <div id="grows"></div>
    <button type="button" class="btn ghost" id="gadd">+ Add course</button>
    <div class="result"><div class="k">Semester GPA</div><div class="big" id="gout"></div><div class="stats" id="gstats"></div></div>
    <h3 class="sec">Cumulative GPA <span class="muted small">(optional)</span></h3>
    <div class="grid2">
      <div class="field"><label for="pg">Current GPA</label><input id="pg" type="number" step="0.01" min="0" max="5" inputmode="decimal" placeholder="e.g. 3.45"></div>
      <div class="field"><label for="pc">Credits already completed</label><input id="pc" type="number" step="1" min="0" inputmode="numeric" placeholder="e.g. 60"></div>
    </div>
    <p class="muted small">Uses the common 4.0 scale. Honors adds 0.5 and AP/IB adds 1.0 to the weighted GPA (not for F grades).</p>
  </div>`;
  function drawRows() {
    $('#grows').innerHTML = rows.map((r, i) => `<div class="gpa-row" data-i="${i}">
      <input class="gname" aria-label="Course name" placeholder="Course ${i + 1}" value="${esc(r.name)}">
      <input class="gcr" type="number" min="0" step="0.5" inputmode="decimal" aria-label="Credits" value="${r.cr}">
      <select class="gg" aria-label="Grade">${GRADES.map(([g, p]) => `<option value="${g}" ${g === r.g ? 'selected' : ''}>${g} · ${p.toFixed(1)}</option>`).join('')}</select>
      <select class="gt" aria-label="Course level"><option value="0">Regular</option><option value="0.5">Honors</option><option value="1">AP / IB</option></select>
      <button type="button" class="icon-btn gdel" aria-label="Remove course" title="Remove">×</button>
    </div>`).join('');
    $$('.gt', root).forEach((s, i) => { s.value = String(rows[i].t); });

  }
  function calc() {

    const out = $('#gout');

    out.textContent = (qp / cr).toFixed(2);
    let s = stat('Credits', fmt(cr)) + stat('Quality points', fmt(qp, 2));
    if (weighted) s += stat('Weighted GPA', (wqp / cr).toFixed(2));
    const pg = num($('#pg')), pc = num($('#pc'));
    if (!Number.isNaN(pg) && pc > 0) s += stat('Cumulative GPA', ((pg * pc + qp) / (pc + cr)).toFixed(2)) + stat('Total credits', fmt(pc + cr));
    $('#gstats').innerHTML = s;
  }
  $('#grows').addEventListener('input', e => {
    const row = e.target.closest('.gpa-row'); if (!row) return; const r = rows[+row.dataset.i];
    if (e.target.classList.contains('gname')) r.name = e.target.value;
    else if (e.target.classList.contains('gcr')) r.cr = num(e.target);
    else if (e.target.classList.contains('gg')) r.g = e.target.value;
    else if (e.target.classList.contains('gt')) r.t = +e.target.value;
    calc();
  });
  $('#grows').addEventListener('click', e => { const b = e.target.closest('.gdel'); if (!b) return; rows.splice(+b.closest('.gpa-row').dataset.i, 1); drawRows(); });
  $('#gadd').addEventListener('click', () => { rows.push({ name: '', cr: 3, g: 'A', t: 0 }); drawRows(); const n = $$('.gname', root); n[n.length - 1].focus(); });
  $('#pg').addEventListener('input', calc); $('#pc').addEventListener('input', calc);
  drawRows();
}

/* ---------- 9. Fuel ---------- */
function fuel(root) {
  let sys = 'us';
  root.innerHTML = `<div class="panel">
    <div class="pills"><button type="button" class="pill on" data-s="us">US (miles, MPG)</button><button type="button" class="pill" data-s="metric">Metric (km, L/100 km)</button></div>
    <div class="grid2">
      <div class="field"><label for="fd" id="fdl">Trip distance (miles)</label><input id="fd" type="number" step="any" min="0" inputmode="decimal" value="250"></div>
      <div class="field"><label for="fe" id="fel">Fuel economy (MPG)</label><input id="fe" type="number" step="any" min="0" inputmode="decimal" value="28"></div>
      <div class="field"><label for="fp" id="fpl">Fuel price (per gallon)</label><div class="money"><select id="fc" aria-label="Currency"><option>$</option><option>€</option><option>£</option><option>¥</option><option>₹</option><option>C$</option><option>A$</option></select><input id="fp" type="number" step="0.01" min="0" inputmode="decimal" value="3.25"></div></div>
      <div class="field"><label for="fn">People splitting the cost</label><input id="fn" type="number" step="1" min="1" inputmode="numeric" value="1"></div>
    </div>
    <label class="check"><input type="checkbox" id="fr"> Round trip (double the distance)</label>
    <div class="result"><div class="k">Fuel cost</div><div class="big" id="fout"></div><div class="stats" id="fstats"></div></div>
  </div>`;
  const G = 3.785411784, K = 1.609344;
  function labels() {
    $('#fdl').textContent = `Trip distance (${sys === 'us' ? 'miles' : 'km'})`;
    $('#fel').textContent = sys === 'us' ? 'Fuel economy (MPG)' : 'Fuel consumption (L/100 km)';
    $('#fpl').textContent = `Fuel price (per ${sys === 'us' ? 'gallon' : 'liter'})`;
    $$('.pill', root).forEach(p => p.classList.toggle('on', p.dataset.s === sys));
  }
  function calc() {
    const dist = num($('#fd')) * ($('#fr').checked ? 2 : 1), eff = num($('#fe')), price = num($('#fp')), ppl = Math.max(1, Math.floor(num($('#fn')) || 1)), cur = $('#fc').value, out = $('#fout');
    if ([dist, eff, price].some(Number.isNaN) || eff <= 0) { out.textContent = 'Fill in distance, economy and price'; out.classList.add('err'); $('#fstats').innerHTML = ''; return; }
    out.classList.remove('err');
    const fuelAmt = sys === 'us' ? dist / eff : dist * eff / 100, cost = fuelAmt * price;
    const money = v => cur + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    out.textContent = money(cost);
    const u = sys === 'us' ? ['mi', 'gal'] : ['km', 'L'];
    $('#fstats').innerHTML = stat('Fuel needed', `${fmt(fuelAmt, 2)} ${u[1]}`) + stat('Total distance', `${fmt(dist, 1)} ${u[0]}`) +
      (ppl > 1 ? stat('Per person', money(cost / ppl)) : '') + stat(`Cost per ${u[0]}`, dist > 0 ? money(cost / dist) : '—');
  }
  $('.pills', root).addEventListener('click', e => {
    const b = e.target.closest('.pill'); if (!b || b.dataset.s === sys) return;
    const d = num($('#fd')), ef = num($('#fe')), p = num($('#fp')), r2 = (v, n) => Number.isNaN(v) ? '' : +v.toFixed(n);
    if (b.dataset.s === 'metric') { $('#fd').value = r2(d * K, 1); $('#fe').value = r2(235.214583 / ef, 2); $('#fp').value = r2(p / G, 3); }
    else { $('#fd').value = r2(d / K, 1); $('#fe').value = r2(235.214583 / ef, 1); $('#fp').value = r2(p * G, 2); }
    sys = b.dataset.s; labels(); calc();
  });
  root.addEventListener('input', calc); root.addEventListener('change', calc);
  labels(); calc();
}
